# Triggers on every push and every pull request (any branch). Runs TruffleHog
# (verified-secrets mode only, to keep noise down) against the diff to catch a
# real credential before it's committed.
name: Secret Scan
on: [push, pull_request]
permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@main
        with: { extra_args: --results=verified }
