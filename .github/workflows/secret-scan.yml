# Triggers on every pull request and on pushes to main. Runs TruffleHog
# (verified-secrets mode only, to keep noise down) against the diff to catch a
# real credential before it's committed.
# TKT-1258 (Actions minutes, 2026-10-16): runs on PRs + pushes to main only. A push to a
# feature branch with an open PR used to bill this twice (push + pull_request); pushes
# to other branches are covered by the PR run that gated them. Superseded PR runs are
# cancelled.
name: Secret Scan
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@main
        with: { extra_args: --results=verified }
